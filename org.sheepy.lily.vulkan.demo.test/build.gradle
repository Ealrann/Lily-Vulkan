plugins {
	id 'application'
}

application {
	mainModule = 'org.sheepy.lily.vulkan.demo.test'
	mainClass = 'org.sheepy.lily.vulkan.demo.test.composite.grow.MainCompositeBufferTest'
}

dependencies {
	implementation project(':org.sheepy.lily.vulkan.api')

	// Runtime (providers for ServiceLoader / adapters / allocations)
	runtimeOnly project(':org.sheepy.lily.vulkan.core')
	runtimeOnly project(':org.sheepy.lily.vulkan.resource')
	runtimeOnly project(':org.sheepy.lily.vulkan.process')
	runtimeOnly project(':org.sheepy.lily.vulkan.process.compute')

	runtimeOnly 'org.sheepy.lily.core:lily.core.allocation'
	runtimeOnly 'org.sheepy.lily.core:lily.core.impl'

	// Test
	testImplementation "org.junit.jupiter:junit-jupiter-api:$junitJupiterVersion"
	testImplementation "org.junit.jupiter:junit-jupiter-params:$junitJupiterVersion"

	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitJupiterVersion"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitPlatformVersion"
}

run {
	enableAssertions = true
}

test {
	enableAssertions = true
	useJUnitPlatform()
}

sourceSets {
	main {
		resources.srcDirs += 'src/main/shader'
	}
}
