import org.gradle.internal.os.OperatingSystem

project.ext.targetPlatform = OperatingSystem.current()
switch (targetPlatform) {
	case OperatingSystem.LINUX:
		def osArch = System.getProperty("os.arch")
		project.ext.lwjglNatives = osArch.startsWith("arm") || osArch.startsWith("aarch64")
				? "natives-linux-${osArch.contains("64") || osArch.startsWith("armv8") ? "arm64" : "arm32"}"
				: "natives-linux"
		break
	case OperatingSystem.MAC_OS:
		project.ext.lwjglNatives = "natives-macos"
		break
	case OperatingSystem.WINDOWS:
		project.ext.lwjglNatives = "natives-windows"
		break
}

subprojects {
	apply plugin: 'java-library'

	group = "org.sheepy.lily.vulkan"
	version = "1.3.0"

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	repositories {
		mavenLocal()
		mavenCentral()
		maven { url "https://central.sonatype.com/repository/maven-snapshots" }
	}

	tasks.withType(Test).configureEach {
		// LWJGL 3.4+ uses FFM internals that require explicit module exports.
		jvmArgs("--add-exports=org.lwjgl/org.lwjgl.system.ffm=org.lwjgl.glfw")
		jvmArgs("--add-exports=org.lwjgl/org.lwjgl.system.ffm=org.lwjgl.vulkan")
		jvmArgs("--enable-native-access=org.lwjgl")
	}
}
